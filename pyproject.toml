[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aigc-audio-pipeline"
version = "1.1.0"
description = "Production Chinese radio-drama & multi-cast audiobook pipeline supporting dual backends (Cloud ElevenLabs eleven_v3 + Local 96GB GPU Fish Audio Drama 3 / MOSS v2.0 / ACE-Step 1.5 XL), Xianxia polyphone engine, unabridged cue-sheet compiler, and FFmpeg 3-bus mastering."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
aigc-audio = "aigc_audio_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
