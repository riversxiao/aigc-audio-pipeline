[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aigc-audio-pipeline"
version = "1.0.0"
description = "Production Chinese radio-drama & multi-cast audiobook pipeline powered by ElevenLabs eleven_v3, Voice Design ttv_v3, SFX v3, Music v2.5, Scribe v3 QA, Xianxia polyphone engine, unabridged cue-sheet compiler, and FFmpeg 3-bus natural-timeline mastering."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
aigc-audio = "aigc_audio_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
